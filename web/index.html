<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kit - Your AI Toolkit</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Syntax highlighting theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app" id="app">
        <!-- Icon rail: workspace-wide sections, not tied to any one team member -->
        <nav class="icon-rail" aria-label="Workspace sections">
            <div class="rail-brand" title="Kit">K</div>

            <button class="rail-btn" data-panel="activity" title="Team Activity" aria-label="Team Activity">
                <i class="fas fa-bolt"></i>
            </button>
            <button class="rail-btn" data-panel="schedules" title="Schedules" aria-label="Schedules">
                <i class="fas fa-clock"></i>
            </button>
            <button class="rail-btn" data-panel="sessions" title="Sessions" aria-label="Sessions">
                <i class="fas fa-layer-group"></i>
            </button>

            <div class="rail-spacer"></div>

            <div class="rail-status" id="connection-status" title="Disconnected">
                <span class="rail-status-dot"></span>
            </div>
        </nav>

        <!-- Member sidebar: contacts-style list of team members -->
        <aside class="member-sidebar" id="member-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Kit</div>
                <div class="sidebar-subtitle">Your AI team</div>
            </div>
            <div class="member-list" id="member-list">
                <div class="member-list-loading">Loading team&hellip;</div>
            </div>
            <button class="add-teammate-btn" id="add-teammate-btn">
                <i class="fas fa-plus"></i> Add teammate
            </button>
        </aside>
        <div class="sidebar-scrim" id="sidebar-scrim"></div>

        <!-- Chat -->
        <main class="chat-main">
            <header class="chat-header">
                <button class="icon-action-btn chat-header-menu" id="mobile-menu-btn" title="Team" aria-label="Show team list">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="chat-header-who">
                    <div class="avatar" id="chat-avatar">K</div>
                    <div class="chat-header-text">
                        <div class="chat-header-name" id="chat-header-name">Kit</div>
                        <div class="chat-header-status">
                            <span class="status-dot" id="chat-target-status-dot"></span>
                            <span id="chat-header-status-text">Idle</span>
                        </div>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <span class="pill" id="message-count">0 messages</span>
                    <button class="icon-action-btn" id="clear-chat-button" title="Clear this chat session" aria-label="Clear chat">
                        <i class="fas fa-broom"></i>
                    </button>
                    <button class="icon-action-btn" id="toggle-details-btn" title="Show/hide details" aria-expanded="true" aria-label="Toggle details panel">
                        <i class="fas fa-circle-info"></i>
                    </button>
                </div>
            </header>

            <div id="chat-messages" class="chat-messages"></div>

            <footer class="chat-composer">
                <textarea
                    id="chat-input"
                    class="composer-input"
                    placeholder="Message Kit&hellip;"
                    rows="1"
                ></textarea>
                <button id="send-button" class="composer-send" title="Send" aria-label="Send message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </footer>
        </main>

        <!-- Details panel: info for whichever team member is currently open -->
        <aside class="details-panel" id="details-panel">
            <div class="details-panel-header">
                <span id="details-panel-title">Details</span>
                <button class="icon-action-btn" id="close-details-btn" title="Close" aria-label="Close details panel">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>
            <div class="details-panel-body" id="details-panel-body"></div>
        </aside>
    </div>

    <!-- Workspace overlay: Team Activity / Schedules / Sessions -->
    <div class="workspace-overlay" id="workspace-overlay" hidden>
        <div class="workspace-modal">
            <div class="workspace-modal-header">
                <div class="workspace-tabs" id="workspace-tabs">
                    <button class="workspace-tab" data-tab="activity">
                        <i class="fas fa-bolt"></i> Team Activity
                    </button>
                    <button class="workspace-tab" data-tab="schedules">
                        <i class="fas fa-clock"></i> Schedules
                    </button>
                    <button class="workspace-tab" data-tab="sessions">
                        <i class="fas fa-layer-group"></i> Sessions
                    </button>
                </div>
                <button class="icon-action-btn" id="close-workspace-btn" title="Close" aria-label="Close">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>
            <div class="workspace-modal-body">
                <div id="activity-tab" class="tab-content">
                    <button id="refresh-activity" class="btn btn-secondary">Refresh</button>
                    <div id="activity-list"></div>
                </div>

                <div id="schedules-tab" class="tab-content">
                    <button id="refresh-schedules" class="btn btn-secondary">Refresh</button>
                    <div id="schedules-list"></div>
                </div>

                <div id="sessions-tab" class="tab-content">
                    <div id="sessions-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
