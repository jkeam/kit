<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kit - Your AI Toolkit</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- PatternFly CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@5/patternfly.css">
    <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@5/patternfly-addons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Page Header -->
    <div class="pf-v5-c-page">
        <header class="pf-v5-c-masthead">
            <div class="pf-v5-c-masthead__main">
                <div class="pf-v5-c-masthead__brand">
                    <a class="pf-v5-c-masthead__brand-link brand-link" href="#">
                        <span class="brand-mark">K</span>
                        <span class="brand-wordmark">Kit</span>
                    </a>
                </div>
            </div>
            <div class="pf-v5-c-masthead__content">
                <div class="pf-v5-l-flex pf-m-align-items-center pf-m-gap-md">
                    <div class="pf-v5-l-flex__item">
                        <span id="connection-status" class="pf-v5-c-label pf-m-red">
                            <span class="pf-v5-c-label__content">
                                <span class="pf-v5-c-label__icon">
                                    <i class="fas fa-circle"></i>
                                </span>
                                <span id="connection-text">Disconnected</span>
                            </span>
                        </span>
                    </div>
                    <div class="pf-v5-l-flex__item">
                        <button id="toggle-info-panel" class="pf-v5-c-button pf-m-plain" type="button" title="Show/hide agent info panel" aria-expanded="true">
                            <i class="fas fa-sliders-h"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div class="pf-v5-c-page__main">
            <section class="pf-v5-c-page__main-section">
                <div class="pf-v5-l-grid pf-m-gutter">
                    <!-- Chat Panel (Left) -->
                    <div id="chat-panel-col" class="pf-v5-l-grid__item pf-m-6-col">
                        <div class="pf-v5-c-card">
                            <div class="pf-v5-c-card__header">
                                <div class="pf-v5-c-card__header-main">
                                    <div class="agent-status-dot" id="chat-target-status-dot" title="Idle"></div>
                                    <select id="chat-agent-select" class="pf-v5-c-form-control agent-select" title="Who you're talking to">
                                        <option value="kit">Kit (Manager)</option>
                                    </select>
                                </div>
                                <div class="pf-v5-c-card__actions">
                                    <span class="pf-v5-c-label pf-m-blue">
                                        <span class="pf-v5-c-label__content">
                                            <span id="session-id">web:browser</span>
                                        </span>
                                    </span>
                                    <span class="pf-v5-c-label pf-m-outline" style="margin-left: 8px;">
                                        <span class="pf-v5-c-label__content">
                                            <span id="message-count">0 messages</span>
                                        </span>
                                    </span>
                                    <button id="clear-chat-button" class="pf-v5-c-button pf-m-secondary pf-m-small" style="margin-left: 8px;" title="Clear this chat session">
                                        Clear Chat
                                    </button>
                                </div>
                            </div>
                            <div class="pf-v5-c-card__body chat-card-body">
                                <div id="chat-messages" class="chat-messages"></div>
                            </div>
                            <div class="pf-v5-c-card__footer">
                                <div class="pf-v5-c-input-group">
                                    <textarea
                                        id="chat-input"
                                        class="pf-v5-c-form-control"
                                        placeholder="Type your message..."
                                        rows="2"
                                    ></textarea>
                                    <button id="send-button" class="pf-v5-c-button pf-m-primary">
                                        Send
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Info Panel (Right) -->
                    <div id="info-panel-col" class="pf-v5-l-grid__item pf-m-6-col">
                        <div class="pf-v5-c-card">
                            <div class="pf-v5-c-card__header">
                                <div class="pf-v5-c-tabs pf-m-box" id="info-tabs">
                                    <ul class="pf-v5-c-tabs__list">
                                        <li class="pf-v5-c-tabs__item pf-m-current">
                                            <button class="pf-v5-c-tabs__link" data-tab="sessions">
                                                <span class="pf-v5-c-tabs__item-text">Sessions</span>
                                            </button>
                                        </li>
                                        <li class="pf-v5-c-tabs__item">
                                            <button class="pf-v5-c-tabs__link" data-tab="agents">
                                                <span class="pf-v5-c-tabs__item-text">Agents</span>
                                            </button>
                                        </li>
                                        <li class="pf-v5-c-tabs__item">
                                            <button class="pf-v5-c-tabs__link" data-tab="activity">
                                                <span class="pf-v5-c-tabs__item-text">Team Activity</span>
                                            </button>
                                        </li>
                                        <li class="pf-v5-c-tabs__item">
                                            <button class="pf-v5-c-tabs__link" data-tab="memory">
                                                <span class="pf-v5-c-tabs__item-text">Memory</span>
                                            </button>
                                        </li>
                                        <li class="pf-v5-c-tabs__item">
                                            <button class="pf-v5-c-tabs__link" data-tab="tools">
                                                <span class="pf-v5-c-tabs__item-text">Tools</span>
                                            </button>
                                        </li>
                                        <li class="pf-v5-c-tabs__item">
                                            <button class="pf-v5-c-tabs__link" data-tab="schedules">
                                                <span class="pf-v5-c-tabs__item-text">Schedules</span>
                                            </button>
                                        </li>
                                        <li class="pf-v5-c-tabs__item">
                                            <button class="pf-v5-c-tabs__link" data-tab="skills">
                                                <span class="pf-v5-c-tabs__item-text">Skills</span>
                                            </button>
                                        </li>
                                        <li class="pf-v5-c-tabs__item">
                                            <button class="pf-v5-c-tabs__link" data-tab="persona">
                                                <span class="pf-v5-c-tabs__item-text">Persona</span>
                                            </button>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                            <div class="pf-v5-c-card__body info-card-body">
                                <!-- Sessions Tab -->
                                <div id="sessions-tab" class="tab-content pf-m-current">
                                    <div id="sessions-list"></div>
                                </div>

                                <!-- Agents Tab -->
                                <div id="agents-tab" class="tab-content">
                                    <div id="agents-list"></div>
                                    <div class="pf-v5-c-card agent-new-card">
                                        <div class="pf-v5-c-card__title">Add a team member</div>
                                        <div class="pf-v5-c-card__body">
                                            <div class="pf-v5-c-form">
                                                <div class="pf-v5-c-form__group">
                                                    <label class="pf-v5-c-form__label" for="new-agent-template">Template</label>
                                                    <select id="new-agent-template" class="pf-v5-c-form-control"></select>
                                                </div>
                                                <div class="pf-v5-c-form__group">
                                                    <label class="pf-v5-c-form__label" for="new-agent-id">Id</label>
                                                    <input id="new-agent-id" class="pf-v5-c-form-control" type="text" placeholder="e.g. tester-1">
                                                </div>
                                                <div class="pf-v5-c-form__group">
                                                    <label class="pf-v5-c-form__label" for="new-agent-name">Display name (optional)</label>
                                                    <input id="new-agent-name" class="pf-v5-c-form-control" type="text" placeholder="e.g. Tester">
                                                </div>
                                                <button id="create-agent-button" class="pf-v5-c-button pf-m-primary">Create agent</button>
                                                <span id="create-agent-status" class="agent-form-status"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Team Activity Tab -->
                                <div id="activity-tab" class="tab-content">
                                    <button id="refresh-activity" class="pf-v5-c-button pf-m-secondary" style="margin-bottom: 1rem;">
                                        Refresh
                                    </button>
                                    <div id="activity-list"></div>
                                </div>

                                <!-- Memory Tab -->
                                <div id="memory-tab" class="tab-content">
                                    <div class="pf-v5-c-input-group" style="margin-bottom: 1rem;">
                                        <input
                                            id="memory-search-input"
                                            class="pf-v5-c-form-control"
                                            type="text"
                                            placeholder="Search memories..."
                                        >
                                        <button id="memory-search-btn" class="pf-v5-c-button pf-m-primary">
                                            Search
                                        </button>
                                    </div>
                                    <div id="memory-results"></div>
                                </div>

                                <!-- Tools Tab -->
                                <div id="tools-tab" class="tab-content">
                                    <p class="tab-hint">Kit's full tool registry. Each agent is scoped to a subset of these (see the Agents tab).</p>
                                    <div id="tools-list" class="pf-v5-c-description-list"></div>
                                </div>

                                <!-- Schedules Tab -->
                                <div id="schedules-tab" class="tab-content">
                                    <button id="refresh-schedules" class="pf-v5-c-button pf-m-secondary" style="margin-bottom: 1rem;">
                                        Refresh
                                    </button>
                                    <div id="schedules-list"></div>
                                </div>

                                <!-- Skills Tab -->
                                <div id="skills-tab" class="tab-content">
                                    <button id="refresh-skills" class="pf-v5-c-button pf-m-secondary" style="margin-bottom: 1rem;">
                                        Refresh
                                    </button>
                                    <div id="skills-list"></div>
                                </div>

                                <!-- Persona Tab -->
                                <div id="persona-tab" class="tab-content">
                                    <p style="margin-bottom: 0.75rem; font-size: 13px; color: var(--pf-v5-global--Color--200);">
                                        Edit SOUL.md to define Kit's personality, behavior, and communication style. Changes take effect on the next message.
                                    </p>
                                    <textarea
                                        id="persona-editor"
                                        class="pf-v5-c-form-control persona-editor"
                                        rows="18"
                                        placeholder="Loading..."
                                    ></textarea>
                                    <div style="margin-top: 0.75rem; display: flex; gap: 8px;">
                                        <button id="save-persona" class="pf-v5-c-button pf-m-primary">Save</button>
                                        <span id="persona-status" style="font-size: 13px; color: var(--pf-v5-global--success-color--100); align-self: center;"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
