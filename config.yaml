# Gateway host/port/auth, LLM provider/model, and memory retention are all
# configured via environment variables (see .env.example) — not here, to
# avoid two sources of truth for the same settings.
#
# This file only carries tools.safety below, which is the one block actually
# read by the code (tools/core.py:_load_shell_safety_config).

tools:
  safety:
    shell_confirm_destructive: true
    allowed_commands: []  # Empty = all allowed (use with caution)
