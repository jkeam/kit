apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kit-use-builder-scc
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["kit-builder"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kit-builder-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kit-use-builder-scc
subjects:
  - kind: ServiceAccount
    name: kit-builder
    namespace: kit
