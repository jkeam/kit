apiVersion: apps/v1
kind: Deployment
metadata:
  name: kit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kit
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kit
    spec:
      containers:
        - name: kit
          image: image-registry.openshift-image-registry.svc:5000/kit/kit:latest
          ports:
            - containerPort: 18789
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kit-config
            - secretRef:
                name: kit-secrets
          volumeMounts:
            - name: workspace
              mountPath: /opt/app-root/src/workspace
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 18789
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 18789
            initialDelaySeconds: 15
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /health
              port: 18789
            failureThreshold: 12
            periodSeconds: 5
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: kit-workspace
